task:
  name: "GreedyLoRE AutoResearch V1"
  description: |
    Improve the pinned GreedyLoRE seed while preserving the fixed quality gate
    and optimizing the fixed four-GPU efficiency protocol. Formal evaluation is
    controlled by taskdata/eval_contract.yaml and published only through trusted
    task-specific commands.

grader:
  entrypoint: greedylore_autoresearch_grader.grader:Grader
  setup:
  - uv pip install -e ./grader
  - uv pip install -e ./autoresearch
  timeout: 0
  direction: maximize
  args:
    pretraining_allow_other_users: false
    gpu_lock_dir: null
    gpu_poll_interval_seconds: 5
    gpu_wait_timeout_seconds: 86400
    timing_monitor_interval_seconds: 1
    trusted_workflow_handler: autoresearch.state:handle_workflow
    trusted_workflow_worker: autoresearch.lifecycle:run_worker
    trusted_workflow_authorizer: autoresearch.state:authorize_attempt
    trusted_dispatch_filter: autoresearch.state:filter_dispatch
    trusted_artifact_authorizer: autoresearch.state:authorize_artifact
    trusted_memory_authorizer: autoresearch.state:authorize_memory_start
    trusted_memory_worker: autoresearch.memory:run_worker
    trusted_diagnostic_handler: autoresearch.diagnostics:handle_diagnostic
    analyzer_diagnostics: true
    engineer_diagnostics: true
    p_explore: 0.20
    research_planning_lease_seconds: 1800
    max_active_nodes: 2
    # Opt in per run only: local IPC exception for the isolated Analyzer.
    analyzer_allow_unix_sockets: false
    # Explicit public Python/CUDA/data roots can be mounted read-only when needed.
    # Never include .coral/private, home directories, credentials or other runs.
    diagnostic_runtime_roots: []
    diagnostic_path: /usr/local/bin:/usr/bin:/bin
    max_engineering_runs_per_node: 1
    trusted_submission_validator: autoresearch.submission:validate_submission
    trusted_artifact_validator: autoresearch.artifacts:validate_artifact
  parallel:
    max_workers: 1
    max_waiting_workers: 2
  private:
  - taskdata/eval_contract.yaml
  - taskdata/dense_references
agents:
  runtime: codex
  heartbeat_enabled: false
  timeout: 10800
  # Two formal GPU queues (24h each), plus the client execution allowance.
  grader_pending_max_age: 176400
  dynamic:
    enabled: true
  assignments:
  - role: research
    runtime_options:
      role_file: ./roles/researcher.md
  - role: engineering
    runtime_options:
      role_file: ./roles/engineer.md
  sandbox:
    enabled: true
    provider: srt
    network: allowlist
    extra_settings:
      network:
        # Linux SRT IPC opt-in permits Unix and VM sockets for trusted commands.
        allowAllUnixSockets: true
    allowed_domains:
    - api.openai.com
    - chatgpt.com
    - '*.openai.com'
    - '*.chatgpt.com'
workspace:
  results_dir: ./results
  repo_path: ./tasks/greedylore_autoresearch/seed
  setup:
  - uv sync --frozen
  - uv pip install --python .venv/bin/python -e /home/wyr/CORAL/tasks/greedylore_autoresearch/autoresearch
run:
  verbose: false
  ui: false
  session: local

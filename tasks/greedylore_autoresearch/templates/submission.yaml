# 放在候选代码仓库根目录，随 coral eval 自动提交；grader 从固定 checkout 读取。
mode: research                 # research | engineering
node_id: N023
node_type: research             # research | seed；仅 Root N000 为 seed，node_type 不改变 grader profile
base_commit: "<full sha>"      # 候选代码实际上选择的 parent/engineering base
quality_anchor: null           # engineering 必填：唯一完成 quality 的 research SHA
analysis_refs:
  parent_research: "N017/research_analysis_v1.md"  # seed Root 为 null
  parent_engineering: null

# Seed Root：先固定已有 baseline SHA S0；本文件新增后 coral eval 生成 A0（正式 Research Attempt），S0 和 A0 分别记录，算法实现不得在 Bootstrap 中改变。
# 同一 node 只允许一个不同 SHA 的正式 Research Attempt；infra retry 必须使用完全相同 SHA。
change_summary: "<本次代码改动；research 代表本 Node 唯一的算法实现>"
selection_rationale: "<1–3 句：为何选择此 parent/Node + base commit；工程模式尤其要求>"

# soft semantic evidence，不是 grader 的严格等价证明。
semantic_self_check:
  status: not_applicable      # pass | fail | partial | not_run | not_applicable
  commands: []                # 实际执行的命令 / log paths
  limitations: ""            # 未覆盖行为和数值疑点

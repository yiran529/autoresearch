[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greedylore-autoresearch"
version = "0.1.0"
description = "Task-local workflow for GreedyLoRE AutoResearch"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
autoresearch = "autoresearch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]

[tool.hatch.build]
# Explicit editable path: ancestor autoresearch/ ignore rules can hide auto-discovery.
dev-mode-dirs = ["src"]
